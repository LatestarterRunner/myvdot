name: Build APK

on:
  push:
  workflow_dispatch:

defaults:
  run:
    working-directory: aplikasi-vdot-android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - run: cp -r icons/res/. android/app/src/main/res/
      - run: npx cap sync android
      - run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        working-directory: aplikasi-vdot-android/android
      - uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-VDOT-apk
          path: aplikasi-vdot-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
